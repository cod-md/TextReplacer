name: Build LSPosed Module

# This workflow runs every time you push code to the 'main' branch
on:
  push:
    branches: [ main ]
  workflow_dispatch: # This allows you to trigger the build manually if needed

jobs:
  build:
    name: Build APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          submodules: true # This automatically fixes the missing libxposed-api folder

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      # This removes the broken libxposed-compat lines automatically so the build doesn't crash
      - name: Fix broken template dependencies
        run: |
          sed -i '/libxposed-compat/d' settings.gradle.kts
          sed -i '/libxposed-compat/d' app/build.gradle.kts

      - name: Build Debug APK
        run: ./gradlew assembleDebug

      # This step uploads the finished APK so you can download it
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: app/build/outputs/apk/debug/app-debug.apk
