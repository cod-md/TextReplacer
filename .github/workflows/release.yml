name: Publish Text Replacer Release

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/release.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: text-replacer-v1.0.0-release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
        with:
          submodules: true

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: temurin
          cache: gradle

      - name: Build APK using existing build procedure
        run: |
          chmod +x gradlew
          sed -i '/libxposed-compat/d' settings.gradle.kts
          sed -i '/libxposed-compat/d' app/build.gradle.kts
          ./gradlew assembleDebug

      - name: Publish v1.0.0 with APK
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp app/build/outputs/apk/debug/app-debug.apk TextReplacer-v1.0.0-debug.apk
          cat > release-notes.md <<'EOF'
          Initial Text Replacer release.

          - Custom text replacement through Gboard.
          - Companion app to add, edit, and delete replacement rules.
          - Case-insensitive matching and framework remote preference storage.
          - Updated README with setup instructions, examples, and current limitations.

          Requires Android 12+ and a rooted device with a compatible modern libxposed framework. Enable the module for Gboard and the companion app, then restart Gboard. Restart Gboard again after changing rules.

          Matching can replace substrings inside longer words. Verbose framework logs can include typed text. See the README for details.

          The attached APK is a debug build produced by GitHub Actions, not a production-signed release APK.
          EOF
          if gh release view v1.0.0 >/dev/null 2>&1; then
            echo "v1.0.0 already exists; leaving the published release unchanged."
          else
            gh release create v1.0.0 TextReplacer-v1.0.0-debug.apk --target "$GITHUB_SHA" --title "Text Replacer v1.0.0" --notes-file release-notes.md
          fi
