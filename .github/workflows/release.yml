name: Publish Text Replacer Release

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/release.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: text-replacer-v1.0.0-release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Publish v1.0.0
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cat > release-notes.md <<'EOF'
          Initial versioned release of Text Replacer.

          - Custom text replacement through Gboard.
          - Companion app to add, edit, and delete replacement rules.
          - Case-insensitive matching and framework remote preference storage.
          - Updated README with installation instructions, examples, and implementation limitations.

          Requires Android 12+ and a rooted device with a compatible modern libxposed framework. Enable the module for Gboard and the companion app. Restart Gboard after changing rules.

          Matching can replace substrings inside longer words. Verbose framework logs can include typed text. See the README for details.

          **Source release only:** no APK is attached. The current APK build is blocked because the pinned libxposed-api submodule at https://github.com/libxposed/api is unavailable (GitHub returns 404). The source archives do not include submodule contents.
          EOF
          if gh release view v1.0.0 >/dev/null 2>&1; then
            echo "v1.0.0 already exists; leaving the published release unchanged."
          else
            gh release create v1.0.0 --target "$GITHUB_SHA" --title "Text Replacer v1.0.0" --notes-file release-notes.md
          fi
