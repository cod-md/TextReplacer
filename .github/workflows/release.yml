name: Publish Text Replacer Release

on:
  push:
    branches: [ main ]
    paths:
      - '.github/workflows/release.yml'
  workflow_dispatch:

permissions:
  contents: write
  actions: read

jobs:
  publish-release:
    runs-on: ubuntu-latest
    steps:
      - name: Download built debug APK from run 45486044625
        uses: actions/download-artifact@v4
        with:
          name: app-debug
          run-id: 45486044625
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: dist

      - name: Rename APK and compute SHA-256
        run: |
          mv dist/app-debug.apk dist/TextReplacer-v1.1.0-debug.apk
          SHA256=$(sha256sum dist/TextReplacer-v1.1.0-debug.apk | awk '{print $1}')
          echo "APK_SHA256=$SHA256" >> "$GITHUB_ENV"
          echo "SHA-256: $SHA256"

      - name: Create Release v1.1.0
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cat <<EOF > release-notes.md
          ## Text Replacer v1.1.0

          ### What's New
          - Detects and replaces blocked words formed after deleting spaces or characters between split letters (e.g. typing \`fuc k\` and backspacing the space between \`c\` and \`k\`).
          - Detects and replaces blocked words formed by inserting characters mid-word or via composing text updates.
          - Adds hooks for \`deleteSurroundingText\`, \`deleteSurroundingTextInCodePoints\`, \`sendKeyEvent\` (\`KEYCODE_DEL\` / \`KEYCODE_FORWARD_DEL\`), \`setComposingText\`, and \`finishComposingText\` with a re-entrancy guard.

          ### Download & Verification
          - **APK:** \`TextReplacer-v1.1.0-debug.apk\` (built from commit \`bb48204\` in Actions run #59)
          - **SHA-256:** \`${APK_SHA256}\`
          EOF

          if gh release view v1.1.0 >/dev/null 2>&1; then
            gh release upload v1.1.0 dist/TextReplacer-v1.1.0-debug.apk --clobber
            gh release edit v1.1.0 --title "Text Replacer v1.1.0" --notes-file release-notes.md
          else
            gh release create v1.1.0 dist/TextReplacer-v1.1.0-debug.apk \
              --target main \
              --title "Text Replacer v1.1.0" \
              --notes-file release-notes.md
          fi
